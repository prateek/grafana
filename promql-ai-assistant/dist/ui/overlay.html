<div class="prom-ai-overlay" data-prom-ai-overlay hidden>
  <div class="prom-ai-overlay__backdrop" data-prom-ai-overlay-close></div>
  <section class="prom-ai-overlay__panel" role="dialog" aria-modal="true">
    <header class="prom-ai-overlay__header">
      <h2 class="prom-ai-overlay__title" data-prom-ai-overlay-title>PromQL Assistant</h2>
      <button type="button" class="prom-ai-overlay__close" data-prom-ai-overlay-close aria-label="Close PromQL assistant">
        ×
      </button>
    </header>
    <div class="prom-ai-overlay__body">
      <iframe
        title="Assistants UI"
        class="prom-ai-overlay__iframe"
        src="about:blank"
        data-prom-ai-assistant-frame
        allow="clipboard-write"
      ></iframe>
    </div>
  </section>
</div>
